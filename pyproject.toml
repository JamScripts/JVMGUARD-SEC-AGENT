[project]
name = "jvmguard-sec-agent"
version = "0.4.0"
description = "Experimental runtime security layer for agentic AI systems."
readme = "README.md"
authors = [
    { name = "JamScripts" }
]
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
]

[project.scripts]
jvmguard = "jvmguard.agent:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
